name: Sync, build and publish to GitHub and CNB

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to retry, or leave empty to sync and release the selected branch"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: sync-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          echo "publish=false" >> "${GITHUB_OUTPUT}"
          if [[ -n "${REQUESTED_TAG}" ]]; then
            tag="${REQUESTED_TAG}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "Only repository sync is needed for branch ${GITHUB_REF_NAME}." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          else
            version="$(node -p 'require("./package.json").version')"
            tag="v${version}"
            if git show-ref --verify --quiet "refs/tags/${tag}"; then
              if [[ "$(git rev-parse "refs/tags/${tag}^{commit}")" != "$(git rev-parse HEAD)" ]]; then
                echo "Release skipped: ${tag} already exists at an earlier commit. Bump package.json to publish a new version; rerun with tag ${tag} to retry its release. Repository sync will continue below." >> "${GITHUB_STEP_SUMMARY}"
                exit 0
              fi
            fi
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vX.Y.Z format." >&2
            exit 1
          fi
          version="$(node -p 'require("./package.json").version')"
          if [[ "${tag}" != "v${version}" ]]; then
            echo "package.json version ${version} does not match release tag ${tag}." >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/${tag}"; then
            git tag "${tag}"
            git push origin "refs/tags/${tag}:refs/tags/${tag}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "publish=true" >> "${GITHUB_OUTPUT}"
          echo "Will build and publish ${tag} in this workflow run." >> "${GITHUB_STEP_SUMMARY}"

      - name: Sync branch and release tag to CNB
        shell: bash
        env:
          CNB_USERNAME: ${{ secrets.CNB_USERNAME }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO_SLUG: ${{ vars.CNB_REPO_SLUG }}
          REQUESTED_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${CNB_USERNAME}" || -z "${CNB_TOKEN}" || -z "${CNB_REPO_SLUG}" ]]; then
            echo "Configure CNB_USERNAME, CNB_TOKEN and repository variable CNB_REPO_SLUG first." >&2
            exit 1
          fi
          git remote add cnb "https://${CNB_USERNAME}:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git"
          git fetch cnb --prune
          if [[ "${GITHUB_REF_TYPE}" == "branch" && -z "${REQUESTED_TAG}" ]]; then
            git push --force-with-lease cnb "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
          if [[ -n "${RELEASE_TAG}" ]]; then
            git push cnb "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Read package version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          if ("v$version" -ne $env:RELEASE_TAG) {
            throw "package.json version $version does not match the release tag"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run desktop:build
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Create installer checksum
        shell: pwsh
        run: |
          $installer = "release/TMP-Update-${{ steps.version.outputs.version }}-Setup.exe"
          $checksum = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $(Split-Path $installer -Leaf)" | Set-Content "$installer.sha256" -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TMP-Update-Windows-${{ steps.version.outputs.version }}
          path: |
            release/TMP-Update-${{ steps.version.outputs.version }}-Setup.exe
            release/TMP-Update-${{ steps.version.outputs.version }}-Setup.exe.sha256
          if-no-files-found: error

      - name: Prepare release notes
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notes = "release-notes/v$version.md"
          if (-not (Test-Path $notes)) {
            New-Item -ItemType Directory -Force -Path release-notes | Out-Null
            $commits = @(git log -5 --pretty=format:'- %s')
            @("# TMP File Mirror v$version", "", "## 更新内容", "", $commits) | Set-Content -Path $notes -Encoding utf8
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: TMP 更新工具 v${{ steps.version.outputs.version }}
          body_path: release-notes/v${{ steps.version.outputs.version }}.md
          generate_release_notes: true
          files: |
            release/TMP-Update-${{ steps.version.outputs.version }}-Setup.exe
            release/TMP-Update-${{ steps.version.outputs.version }}-Setup.exe.sha256

      - name: Prepare CNB attachment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path cnb-artifacts | Out-Null
          Copy-Item "release/TMP-Update-${{ steps.version.outputs.version }}-Setup.exe" cnb-artifacts/
          Copy-Item "release/TMP-Update-${{ steps.version.outputs.version }}-Setup.exe.sha256" cnb-artifacts/

      - name: Upload CNB attachment artifact
        uses: actions/upload-artifact@v4
        with:
          name: TMP-Update-CNB-${{ steps.version.outputs.version }}
          path: cnb-artifacts/**

  publish-cnb:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.build.outputs.version }}
          fetch-depth: 0

      - name: Download CNB attachment
        uses: actions/download-artifact@v4
        with:
          name: TMP-Update-CNB-${{ needs.build.outputs.version }}
          path: cnb-artifacts

      - name: Create CNB release and upload installer
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO_SLUG: ${{ vars.CNB_REPO_SLUG }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          api="https://api.cnb.cool/${CNB_REPO_SLUG}/-/releases"
          auth=(-H "Authorization: Bearer ${CNB_TOKEN}" -H "Accept: application/vnd.cnb.api+json")

          release_json="$(curl --fail --silent --show-error --location \
            "${api}/tags/${tag}" "${auth[@]}" 2>/dev/null || true)"
          release_id="$(jq -r '.id // empty' <<< "${release_json}")"

          if [[ -z "${release_id}" ]]; then
            commit_sha="$(git rev-list -n 1 "refs/tags/${tag}")"
            release_notes="release-notes/v${VERSION}.md"
            if [[ ! -f "${release_notes}" ]]; then
              printf '# TMP File Mirror v%s\n\n## 更新内容\n\n%s\n' "${VERSION}" "$(git log -5 --pretty=format:'- %s')" > "${release_notes}"
            fi
            release_json="$(curl --fail --silent --show-error --location \
              -X POST "${api}" "${auth[@]}" -H "Content-Type: application/json" \
              --data "$(jq -cn \
                --arg tag "${tag}" \
                --arg target "${commit_sha}" \
                --arg name "TMP 更新工具 v${VERSION}" \
                --rawfile body "${release_notes}" \
                '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:false,prerelease:false,make_latest:"true"}')")"
            release_id="$(jq -r '.id // empty' <<< "${release_json}")"
          fi

          if [[ -z "${release_id}" ]]; then
            echo "CNB release response did not include a release id." >&2
            jq . <<< "${release_json}" >&2 || true
            exit 1
          fi

          for asset in "cnb-artifacts/TMP-Update-${VERSION}-Setup.exe" "cnb-artifacts/TMP-Update-${VERSION}-Setup.exe.sha256"; do
            asset_name="$(basename "${asset}")"
            asset_size="$(stat -c '%s' "${asset}")"
            upload_json="$(curl --fail --silent --show-error --location \
              -X POST "${api}/${release_id}/asset-upload-url" "${auth[@]}" \
              -H "Content-Type: application/json" \
              --data "$(jq -cn --arg name "${asset_name}" --argjson size "${asset_size}" \
                '{asset_name:$name,size:$size,overwrite:true,ttl:0}')")"
            upload_url="$(jq -r '.upload_url // empty' <<< "${upload_json}")"
            verify_url="$(jq -r '.verify_url // empty' <<< "${upload_json}")"
            if [[ -z "${upload_url}" || -z "${verify_url}" ]]; then
              echo "CNB upload URL response was incomplete." >&2
              jq . <<< "${upload_json}" >&2 || true
              exit 1
            fi
            curl --fail --silent --show-error --location -X PUT --upload-file "${asset}" "${upload_url}"
            curl --fail --silent --show-error --location -X POST "${verify_url}?ttl=0" "${auth[@]}"
            echo "CNB release ${tag} uploaded ${asset_name}."
          done
