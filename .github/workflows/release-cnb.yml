name: Build and publish release to GitHub and CNB

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag, for example vX.Y.Z"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          if ("v$version" -ne "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}") {
            throw "package.json version $version does not match the release tag"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run desktop:build
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TMP-Update-Windows-${{ steps.version.outputs.version }}
          path: release/TMP-Update-${{ steps.version.outputs.version }}-Setup.exe
          if-no-files-found: error

      - name: Prepare release notes
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notes = "release-notes/v$version.md"
          if (-not (Test-Path $notes)) {
            New-Item -ItemType Directory -Force -Path release-notes | Out-Null
            $commits = @(git log -5 --pretty=format:'- %s')
            @("# TMP File Mirror v$version", "", "## 更新内容", "", $commits) | Set-Content -Path $notes -Encoding utf8
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: TMP 更新工具 v${{ steps.version.outputs.version }}
          body_path: release-notes/v${{ steps.version.outputs.version }}.md
          generate_release_notes: true
          files: release/TMP-Update-${{ steps.version.outputs.version }}-Setup.exe

      - name: Prepare CNB attachment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path cnb-artifacts | Out-Null
          Copy-Item "release/TMP-Update-${{ steps.version.outputs.version }}-Setup.exe" cnb-artifacts/

      - name: Upload CNB attachment artifact
        uses: actions/upload-artifact@v4
        with:
          name: TMP-Update-CNB-${{ steps.version.outputs.version }}
          path: cnb-artifacts/**

  publish-cnb:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.build.outputs.version }}
          fetch-depth: 0

      - name: Download CNB attachment
        uses: actions/download-artifact@v4
        with:
          name: TMP-Update-CNB-${{ needs.build.outputs.version }}
          path: cnb-artifacts

      - name: Push tag to CNB
        shell: bash
        env:
          CNB_USERNAME: ${{ secrets.CNB_USERNAME }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO_SLUG: ${{ vars.CNB_REPO_SLUG }}
        run: |
          set -euo pipefail
          if [[ -z "${CNB_USERNAME}" || -z "${CNB_TOKEN}" || -z "${CNB_REPO_SLUG}" ]]; then
            echo "Configure CNB_USERNAME, CNB_TOKEN and repository variable CNB_REPO_SLUG first." >&2
            exit 1
          fi
          git remote add cnb "https://${CNB_USERNAME}:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git"
          git fetch cnb --prune
          tag="v${{ needs.build.outputs.version }}"
          local_commit="$(git rev-list -n 1 "refs/tags/${tag}")"
          remote_commit="$(git ls-remote cnb "refs/tags/${tag}^{}" "refs/tags/${tag}" | tail -n 1 | awk '{print $1}')"
          if [[ -n "${remote_commit}" ]]; then
            if [[ "${remote_commit}" != "${local_commit}" ]]; then
              echo "CNB tag ${tag} points to ${remote_commit}; updating it to ${local_commit}."
              git push --force cnb "refs/tags/${tag}:refs/tags/${tag}"
            else
              echo "CNB tag ${tag} already points to the current commit; continuing."
            fi
          else
            git push cnb "refs/tags/${tag}:refs/tags/${tag}"
          fi

      - name: Create CNB release and upload installer
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO_SLUG: ${{ vars.CNB_REPO_SLUG }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          api="https://api.cnb.cool/${CNB_REPO_SLUG}/-/releases"
          asset="cnb-artifacts/TMP-Update-${VERSION}-Setup.exe"
          auth=(-H "Authorization: Bearer ${CNB_TOKEN}" -H "Accept: application/vnd.cnb.api+json")

          release_json="$(curl --fail --silent --show-error --location \
            "${api}/tags/${tag}" "${auth[@]}" 2>/dev/null || true)"
          release_id="$(jq -r '.id // empty' <<< "${release_json}")"

          if [[ -z "${release_id}" ]]; then
            commit_sha="$(git rev-list -n 1 "refs/tags/${tag}")"
            release_notes="release-notes/v${VERSION}.md"
            if [[ ! -f "${release_notes}" ]]; then
              printf '# TMP File Mirror v%s\n\n## 更新内容\n\n%s\n' "${VERSION}" "$(git log -5 --pretty=format:'- %s')" > "${release_notes}"
            fi
            release_json="$(curl --fail --silent --show-error --location \
              -X POST "${api}" "${auth[@]}" -H "Content-Type: application/json" \
              --data "$(jq -cn \
                --arg tag "${tag}" \
                --arg target "${commit_sha}" \
                --arg name "TMP 更新工具 v${VERSION}" \
                --rawfile body "${release_notes}" \
                '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:false,prerelease:false,make_latest:"true"}')")"
            release_id="$(jq -r '.id // empty' <<< "${release_json}")"
          fi

          if [[ -z "${release_id}" ]]; then
            echo "CNB release response did not include a release id." >&2
            jq . <<< "${release_json}" >&2 || true
            exit 1
          fi

          asset_name="$(basename "${asset}")"
          asset_size="$(stat -c '%s' "${asset}")"
          upload_json="$(curl --fail --silent --show-error --location \
            -X POST "${api}/${release_id}/asset-upload-url" "${auth[@]}" \
            -H "Content-Type: application/json" \
            --data "$(jq -cn --arg name "${asset_name}" --argjson size "${asset_size}" \
              '{asset_name:$name,size:$size,overwrite:true,ttl:0}')")"
          upload_url="$(jq -r '.upload_url // empty' <<< "${upload_json}")"
          verify_url="$(jq -r '.verify_url // empty' <<< "${upload_json}")"
          if [[ -z "${upload_url}" || -z "${verify_url}" ]]; then
            echo "CNB upload URL response was incomplete." >&2
            jq . <<< "${upload_json}" >&2 || true
            exit 1
          fi

          curl --fail --silent --show-error --location -X PUT --upload-file "${asset}" "${upload_url}"
          curl --fail --silent --show-error --location -X POST \
            "${verify_url}?ttl=0" "${auth[@]}"
          echo "CNB release ${tag} uploaded ${asset_name}."
